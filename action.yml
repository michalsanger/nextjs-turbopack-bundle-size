name: "Next.js Turbopack Bundle Size"
description: "Tracks bundle size changes across PRs for Next.js apps built with Turbopack"
author: "michalsanger"

branding:
  icon: "package"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token for downloading baseline artifact and posting PR comments"
    required: true
  stats-path:
    description: "Path to the Turbopack stats file generated by the build. Auto-detects between .next/diagnostics/route-bundle-stats.json (Next.js 16.2+) and .next/server/webpack-stats.json (legacy)."
    required: false
    default: ".next/diagnostics/route-bundle-stats.json"
  artifact-name:
    description: "Artifact name prefix used to store and retrieve the baseline stats. The branch name is appended automatically (e.g. turbopack-main-stats-main)."
    required: false
    default: "turbopack-main-stats"
  minimum-change-threshold:
    description: "Byte threshold below which a size change is considered unchanged"
    required: false
    default: "0"
  budget-percent-increase-red:
    description: "Percentage threshold for showing 🔴 on size increases. Increases above this percentage show 🔴, others show 🟡. Default 0 means all increases show 🔴."
    required: false
    default: "0"
  app-name:
    description: "Application name to display in the report header. When set, the sticky PR comment uses a unique header (bundle-size-report-{name}) so matrix jobs do not overwrite each other. If not set, a generic report header and the default comment key are used."
    required: false
    default: ""
  baseline-workflow:
    description: "Workflow file name (e.g. main.yml) to look up the baseline artifact in. Useful when the baseline is produced by a different workflow than the one running this action. When unset, the artifact is searched in the current workflow."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve baseline artifact name
      id: baseline-artifact
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ACTION_PATH: ${{ github.action_path }}
        # On a PR compare against the target branch; on a push baseline the pushed branch.
        REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
      with:
        # Branch names contain characters (e.g. "/") that artifact names forbid,
        # so the ref is slugified. Upload and download both use this output so
        # the names always match.
        script: |
          const path = require('path');
          const { slugifyBranch } = require(
            path.join(process.env.ACTION_PATH, 'src', 'parse-stats.js')
          );
          core.setOutput('name', `${process.env.ARTIFACT_NAME}-${slugifyBranch(process.env.REF)}`);

    - name: Compute baseline route sizes
      if: github.event_name == 'push'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      continue-on-error: true
      env:
        STATS_PATH: ${{ inputs.stats-path }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const path = require('path');
          const { saveRouteSizes } = require(
            path.join(process.env.ACTION_PATH, 'src', 'parse-stats.js')
          );
          saveRouteSizes(process.env.STATS_PATH, 'bundle-route-sizes.json');

    - name: Upload baseline stats
      if: github.event_name == 'push'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      continue-on-error: true
      with:
        name: ${{ steps.baseline-artifact.outputs.name }}
        path: bundle-route-sizes.json
        overwrite: true

    - name: Resolve baseline run
      id: baseline-run
      if: github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      # A failed lookup (API hiccup, rate limit, missing branch) must not fail the
      # caller's job: continue-on-error leaves run-id empty, the download below is
      # skipped, and the report shows everything as 🆕.
      continue-on-error: true
      env:
        ARTIFACT_NAME: ${{ steps.baseline-artifact.outputs.name }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        BASELINE_WORKFLOW: ${{ inputs.baseline-workflow }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const target = process.env.ARTIFACT_NAME;
          const baseRef = process.env.BASE_REF;
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          // Runs are matched to the baseline workflow by file path rather than
          // display name, so two workflows sharing a `name:` stay apart and
          // `baseline-workflow` can point at a different file. The current
          // workflow's path comes from GITHUB_WORKFLOW_REF
          // ("owner/repo/.github/workflows/ci.yml@refs/heads/main").
          const ownWorkflowPath = (process.env.GITHUB_WORKFLOW_REF || '')
            .split('@')[0]
            .replace(/^[^/]+\/[^/]+\//, '');
          const workflowPath = process.env.BASELINE_WORKFLOW
            ? `.github/workflows/${process.env.BASELINE_WORKFLOW}`
            : ownWorkflowPath;
          const workflowLabel = workflowPath || context.workflow;
          const matchesWorkflow = workflowPath
            ? (r) => r.path === workflowPath
            : (r) => r.name === context.workflow;
          core.info(`Resolving baseline artifact "${target}" from branch "${baseRef}" (workflow ${workflowLabel})`);
          // GitHub's run-listing endpoints are all eventually consistent and
          // unreliable for finding the newest run of a specific workflow+branch:
          //   - listWorkflowRuns?branch=... handed back a run from weeks ago
          //     while today's run existed (the original bug).
          //   - listWorkflowRunsForRepo walks newest-first, but on an active repo
          //     this workflow's recent runs are buried past the first pages and an
          //     older run (still unexpired) surfaced first.
          //   - listArtifacts (repo-wide) only returns the current run's artifacts
          //     under the pull_request GITHUB_TOKEN.
          //
          // Deterministic approach: resolve the base branch's TIP commit SHA
          // (getBranch), then list runs for that exact SHA filtered to the
          // baseline workflow. head_sha is indexed deterministically, so the
          // current baseline run is found regardless of ordering lag.
          // If the tip's run has no artifact yet (race: PR opened
          // before the base push's workflow finished), walk base history SHAs via
          // listCommits until one with a matching artifact is found.
          const branch = await octokit.rest.repos.getBranch({ owner, repo, branch: baseRef });
          const tipSha = branch.data.commit.sha;
          core.info(`base branch "${baseRef}" tip: ${tipSha.slice(0, 8)}`);

          const findArtifactInRun = async (runId) => {
            const res = await octokit.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: runId,
            });
            return (res.data.artifacts || []).filter((a) => a.name === target && !a.expired);
          };

          // Candidate SHAs: the tip, then ancestors via listCommits (newest-first).
          let found;
          const commits = await octokit.rest.repos.listCommits({
            owner, repo, sha: tipSha, per_page: 25,
          });
          for (const c of commits.data) {
            const sha = c.sha;
            // listWorkflowRunsForRepo supports head_sha — deterministic.
            const runsRes = await octokit.rest.actions.listWorkflowRunsForRepo({
              owner, repo, head_sha: sha, per_page: 100,
            });
            const runs = (runsRes.data.workflow_runs || [])
              .filter((r) => matchesWorkflow(r) && r.conclusion === 'success')
              .sort((a, b) => b.created_at.localeCompare(a.created_at));
            if (runs.length === 0) {
              core.info(`commit ${sha.slice(0, 8)}: no successful ${workflowLabel} run`);
              continue;
            }
            for (const run of runs) {
              try {
                const items = await findArtifactInRun(run.id);
                if (items.length > 0) {
                  found = { run, artifact: items[0], sha };
                  break;
                }
                core.info(`run ${run.id} (${sha.slice(0, 8)} ${run.created_at}): no "${target}"`);
              } catch (err) {
                core.info(`run ${run.id} (${sha.slice(0, 8)}): artifact listing failed — ${err.message}`);
              }
            }
            if (found) break;
          }
          if (!found) {
            core.warning(
              `No baseline artifact "${target}" found on the last 25 commits of ` +
              `"${baseRef}". Diff will show everything as new.`,
            );
            return;
          }
          core.info(
            `Found artifact ${found.artifact.id} from run ${found.run.id} ` +
            `(commit ${found.sha.slice(0, 8)} ${found.run.created_at})`,
          );
          core.setOutput('run-id', String(found.run.id));

    - name: Download baseline stats
      id: download-baseline
      if: github.event_name == 'pull_request' && steps.baseline-run.outputs.run-id != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      # The run-id was resolved by the step above, so this only needs to fetch
      # one named artifact from that run. The official action supports
      # cross-run downloads (run-id + github-token), replacing the third-party
      # dawidd6/action-download-artifact previously used. continue-on-error keeps
      # the graceful-degradation behavior: a failed download yields an empty
      # baseline and the report shows everything as 🆕 instead of failing the
      # whole workflow.
      continue-on-error: true
      with:
        github-token: ${{ inputs.github-token }}
        run-id: ${{ steps.baseline-run.outputs.run-id }}
        name: ${{ steps.baseline-artifact.outputs.name }}
        path: _bundle-baseline-stats

    - name: Calculate bundle sizes and diff
      if: github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        STATS_PATH: ${{ inputs.stats-path }}
        ACTION_PATH: ${{ github.action_path }}
        MINIMUM_CHANGE_THRESHOLD: ${{ inputs.minimum-change-threshold }}
        BUDGET_PERCENT_INCREASE_RED: ${{ inputs.budget-percent-increase-red }}
        APP_NAME: ${{ inputs.app-name }}
      with:
        script: |
          const path = require('path');
          const fs = require('fs');
          const { parseStatsFile, loadRouteSizes, generateReport } = require(
            path.join(process.env.ACTION_PATH, 'src', 'parse-stats.js')
          );

          const threshold = parseInt(process.env.MINIMUM_CHANGE_THRESHOLD) || 0;
          const budgetPercentIncreaseRed = parseInt(process.env.BUDGET_PERCENT_INCREASE_RED) || 0;
          const currentRoutes = parseStatsFile(process.env.STATS_PATH, true);

          const precomputedPath = path.join('_bundle-baseline-stats', 'bundle-route-sizes.json');
          const legacyFallbackPath = path.join('_bundle-baseline-stats', 'webpack-stats.json');
          let baselineRoutes;
          if (fs.existsSync(precomputedPath)) {
            baselineRoutes = loadRouteSizes(precomputedPath);
          } else if (fs.existsSync(legacyFallbackPath)) {
            baselineRoutes = parseStatsFile(legacyFallbackPath, false);
          } else {
            baselineRoutes = {};
          }

          const appName = process.env.APP_NAME || '';
          fs.writeFileSync('bundle-report.md', generateReport(currentRoutes, baselineRoutes, threshold, budgetPercentIncreaseRed, appName));

    - name: Post or update PR comment
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: ${{ inputs.app-name != '' && format('bundle-size-report-{0}', inputs.app-name) || 'bundle-size-report' }}
        path: bundle-report.md
